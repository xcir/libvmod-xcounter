---
sudo: required
dist: focal

language: c

addons:
  apt:
    packages:
    - python3-docutils
    - python3-sphinx

before_install:
  - set -e
  - wget $VARSNIH_TGZ
  - tar -zxf *gz
  - pushd vinyl-*/
  - ./autogen.sh
  - ./configure --prefix=/usr
  - make -sj32
  - sudo make install
  - popd

before_script:
  - ./autogen.sh
  - ./configure --prefix=/usr
  - make -j4

script:
  - make check -j4

env:
  matrix:
    - VARSNIH_TGZ=https://github.com/vinylcache/vinyl-cache/archive/master.tar.gz
    - VARSNIH_TGZ=https://vinyl-cache.org/_downloads/e2a305a110260371a068ba3f22f10233/vinyl-6.5.1.tgz
    - VARSNIH_TGZ=https://vinyl-cache.org/_downloads/df42864b916648ea4e11fde2e203b99a/vinyl-6.4.0.tgz
    - VARSNIH_TGZ=https://vinyl-cache.org/_downloads/bc70cbaf21bbcd7afbf2281f6da27355/vinyl-6.3.2.tgz
    - VARSNIH_TGZ=https://vinyl-cache.org/_downloads/19761a51f808f74c4a6a1558d72e37f2/vinyl-6.2.3.tgz
    - VARSNIH_TGZ=https://vinyl-cache.org/_downloads/41841608341add28256b374dc367af04/vinyl-6.0.7.tgz

compiler:
  - clang
  - gcc

matrix:
  allow_failures:
    - env: VARSNIH_TGZ=https://github.com/vinylcache/vinyl-cache/archive/master.tar.gz
